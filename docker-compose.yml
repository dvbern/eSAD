services:

  init-perms:
    image: alpine
    user: "0:0"
    command: chown -R 1000:1000 /opt/keycloak/data/h2
    volumes:
    - "esc-keycloak-h2:/opt/keycloak/data/h2"

  esc-keycloak:
    image: docker-registry.dvbern.ch/quay/keycloak/keycloak:26.7
    ports:
      - "8989:8443"
    volumes:
      # - /Users/dvbern/IdeaProjects/esc/esc/api/src/main/resources:/opt/keycloak/data/import
      - "./developer-local-settings/config/keycloakrealm/:/opt/keycloak/data/import"
      - "./developer-local-settings/config/certs/:/opt/certs/"
      - "./developer-local-settings/config/certs/truststores/dvbern-ca.crt:/opt/keycloak/conf/truststores/dvbern-ca.crt"
      # start-dev keeps its state in an embedded H2 under /opt/keycloak/data/h2, which is lost
      # whenever the container is recreated - taking hand-made clients and secrets with it (the
      # hello-data-client service account, for instance). A named volume keeps them.
      # Mounted at .../h2 and not at .../data so the import mount above still applies.
      # To start from scratch: docker compose down -v  (or docker volume rm esc-keycloak-h2)
      - "esc-keycloak-h2:/opt/keycloak/data/h2"
    env_file:
      - ./developer-local-settings/config/keycloak.env
    #environment:
    #  JAVA_OPTS: -XX:UseSVE=0 # fix for m4 mac
    command: >
      start-dev --import-realm
    depends_on:
      init-perms:
        condition: service_completed_successfully
    healthcheck:
      # The management/health port 9000 is served over HTTPS (certs are configured) and this image
      # has no curl/openssl/wget, so we can't probe it with the /dev/tcp trick. Instead probe a
      # plain-HTTP endpoint on 8080 that always responds once Keycloak is serving: the master
      # realm's OIDC discovery document (master always exists, independent of the realm import).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -c 15 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s


  esc-oauthProxy-bs:
    image: docker-registry.dvbern.ch/quay/oauth2-proxy/oauth2-proxy:v7.7.1
    #  entrypoint: "sh"
    command: --config /oauth2-proxy.cfg
    volumes:
      - "./developer-local-settings/config/oauthproxy-bs/oauth2-proxy.cfg:/oauth2-proxy.cfg"
      - "./developer-local-settings/config/certs/:/var/run/secrets/serving-cert"
    ports:
      - "4443:443"
    restart: unless-stopped
    extra_hosts:
      - "local-esc-bs.localhost:host-gateway"
    env_file:
      - ./api/.env
    depends_on:
      esc-keycloak:
        condition: service_healthy

  esc-oauthProxy-win:
    image: docker-registry.dvbern.ch/quay/oauth2-proxy/oauth2-proxy:v7.7.1
    #  entrypoint: "sh"
    command: --config /oauth2-proxy.cfg
    volumes:
      - "./developer-local-settings/config/oauthproxy-win/oauth2-proxy.cfg:/oauth2-proxy.cfg"
      - "./developer-local-settings/config/certs/:/var/run/secrets/serving-cert"
    ports:
      - "5443:443"
    restart: unless-stopped
    extra_hosts:
      - "local-esc-win.localhost:host-gateway"
    env_file:
      - ./api/.env
    depends_on:
      esc-keycloak:
        condition: service_healthy

  esc-oauthProxy-be:
    image: docker-registry.dvbern.ch/quay/oauth2-proxy/oauth2-proxy:v7.7.1
    #  entrypoint: "sh"
    command: --config /oauth2-proxy.cfg
    volumes:
      - "./developer-local-settings/config/oauthproxy-be/oauth2-proxy.cfg:/oauth2-proxy.cfg"
      - "./developer-local-settings/config/certs/:/var/run/secrets/serving-cert"
    ports:
      - "6443:443"
    restart: unless-stopped
    extra_hosts:
      - "local-esc-be.localhost:host-gateway"
    env_file:
      - ./api/.env
    depends_on:
      esc-keycloak:
        condition: service_healthy
## For debugging
#  esc-debug-image:
#    image: docker-registry.dvbern.ch/devops/docker/tools/openshift-workspace:latest
#    extra_hosts:
#      - "local-esc-bs.localhost:host-gateway"

volumes:
  esc-keycloak-h2:
