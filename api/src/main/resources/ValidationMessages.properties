# suppress inspection "UnusedProperty" for whole file
#
# Intentionally empty - the messages live in ValidationMessages_de (the default language), _fr and _en.
#
# Every language in quarkus.locales needs its own file: when the JDK finds nothing but this base
# bundle for a locale, it prefers the bundle of the JVM's default locale, so German texts kept only
# here would come out in English on a JVM running with an English default locale.
#
# This file still has to exist. Hibernate Validator preloads a bundle per locale in quarkus.locales
# and fails with HV000250 for a locale that resolves to no bundle at all (currently it-CH, which has
# no file of its own and gets the texts of the JVM's default locale).
