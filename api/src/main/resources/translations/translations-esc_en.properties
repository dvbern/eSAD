archivdokument.reminder.email.content=EN: <p>Guten Tag</p> <p>F\u00FCr einige der Kinder, f\u00FCr welche Sie zust\u00E4ndig sind, stehen offene Dokumente zur Archivierung bereit. Bitte laden Sie daher diese Dokumente der Schuluntersuchungen im eSAD herunter.<br>Sie finden die Dokumente unter Admin \u2192 Archivdokumente oder direkt \u00FCber folgenden Link:</p> <p><a href={link}>Zu den Archivdokumenten</a></p> <p>Gem\u00E4ss den Nutzungsbestimmungen sind Sie f\u00FCr die Archivierung der Schuluntersuchungsdaten verantwortlich.<br>Weitere Informationen dazu finden Sie auf unserem <a href="https://blog.esad.hemed.ch">Blog</a> oder sie k\u00F6nnen sich gerne an den technischen Support wenden <a href="mailto:{mailsupport}">{mailsupport}</a>.</p> <p><b>Bitte antworten Sie nicht direkt auf diese E-Mail!</b></p> <p>Freundliche Gr\u00FCsse<br>Kantons\u00E4rztlicher Dienst Kanton Bern<p>
