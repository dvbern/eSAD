benutzer-organisation-delegieren.mail.content=<p>Guten Tag</p> <p> {nameArzt} hat Sie berechtigt dazu auf eSAD (elektronisches Schul\u00E4rztliches Dossier) zuzugreifen. Sie k\u00F6nnen sich mit der hinterlegten E-Mail Adresse {eMailBenutzer} via AGOV oder HIN auf der Plattform anmelden:<br> <a href="{linkeSAD}">{linkeSAD}</a> </p><p>In unserem Blog finden Sie eine ausf\u00FChrliche Beschreibung zur Nutzung der Software: <a href="https://blog.esad.hemed.ch">https://blog.esad.hemed.ch</a> <br> <b>Bitte antworten Sie nicht auf diese E-Mail.</b> Bei Fragen d\u00FCrfen Sie sich gerne an unseren Support wenden: <a href="mailto:{eMailsupport}">{eMailsupport}</a>.</p> <p>Freundliche Gr\u00FCsse<br>eSAD-Team<p>
