quarkus.application.name=esc-api
# separating root-path and non-application-root-path
# allows for making the api public but keeping /q stuff private
quarkus.http.root-path=/api
quarkus.http.non-application-root-path=/q
# Keep in Sync with Enum "AppLanguage"
quarkus.locales=de-CH,fr-CH,it-CH,en-US
quarkus.default-locale=de-CH

### api
%dev.app.deployment.environment=LOCAL
%test.app.deployment.environment=UNIT_TEST
%prod.app.deployment.environment=${ESC_API_DEPLOYMENT_ENVIRONMENT}
app.deployment.public-url.bs=${ESC_API_DEPLOYMENT_PUBLIC_URL_BS}
%test.app.deployment.public-url.bs=https://local-esc-bs.localhost:4443/
app.deployment.public-url.win=${ESC_API_DEPLOYMENT_PUBLIC_URL_WIN}
%test.app.deployment.public-url.win=https://local-esc-win.localhost:5443/
app.deployment.version=${APP_VERSION:${quarkus.application.version}}
app.deployment.app-project=esc
app.deployment.app-module=api
app.deployment.instance=${ESC_API_DEPLOYMENT_INSTANCE:${HOSTNAME}}
%dev.app.deployment.instance=dev-${USERNAME:${USER:${USER_FALLBACK}}}
%test.app.deployment.instance=unit-test-${USERNAME:${USER:${USER_FALLBACK:QUARKUSTEST}}}

%dev.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.log.sql=false
#%dev.quarkus.hibernate-orm.scripts.generation=create
#%dev.quarkus.hibernate-orm.scripts.generation.create-target=src/main/resources/db/test-migration/V1.0.0__test-init.sql
#%test.quarkus.log.min-level=TRACE
#%test.quarkus.hibernate-orm.log.bind-parameters=true

### HTTP
%dev.quarkus.http.host=0.0.0.0
%test.quarkus.http.host=localhost
%dev.quarkus.http.ssl.certificate.files=../developer-local-settings/config/certs/multi-domain.pem
%dev.quarkus.http.ssl.certificate.key-files=../developer-local-settings/config/certs/multi-domain.key
%dev.quarkus.http.insecure-requests=disabled
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains; preload
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.limits.max-body-size=20M
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy

### DEV UI
%dev.quarkus.dev-ui.hosts=local-esc-bs.localhost,local-esc-win.localhost
%dev.quarkus.dev-ui.cors.enabled=false

# Die Default-DB ausschalten (sollte sowieso der default sein, wenn keine URL definiert ist)
quarkus.datasource.active=false
quarkus.hibernate-orm.multitenant=DATABASE
# it is recommended to point hibernate to a datasource for it to determine dialect etc
quarkus.hibernate-orm.datasource=bs

### DATABASE
## Mandant BS
quarkus.datasource.bs.db-kind=postgresql
quarkus.datasource.bs.db-version=16
quarkus.datasource.bs.devservices.image-name=docker-registry.dvbern.ch/dockerhub/library/postgres:16
quarkus.datasource.bs.devservices.container-env."TZ"=Europe/Zurich
# connection parameter tuning
quarkus.datasource.bs.jdbc.min-size=4
quarkus.datasource.bs.jdbc.max-size=50
quarkus.datasource.bs.jdbc.max-lifetime=150
quarkus.datasource.bs.jdbc.idle-removal-interval=60
quarkus.datasource.bs.jdbc.background-validation-interval=10
quarkus.datasource.bs.jdbc.leak-detection-interval=61
quarkus.datasource.bs.jdbc.acquisition-timeout=8
# Our K8S-Operator provides the DB-URL via Secret
# => Login stuff only required for local development/testing
quarkus.datasource.bs.devservices.db-name=esc_bs
%dev.quarkus.datasource.bs.devservices.reuse=true
%dev.quarkus.datasource.bs.devservices.enabled=true
%dev,test.quarkus.datasource.bs.username=${ESC_API_DEV_DB_USERNAME_BS:quarkus}
%dev,test.quarkus.datasource.bs.password=${ESC_API_DEV_DB_PASSWORD_BS:quarkus}
%dev.quarkus.datasource.bs.devservices.port=${ESC_API_DEV_DB_PORT_BS:}
%test.quarkus.datasource.bs.devservices.port=${ESC_API_TEST_DB_PORT_BS:0}
%prod.quarkus.datasource.bs.jdbc.url=${ESC_API_DB_URL_BS}
%prod.quarkus.datasource.bs.username=${ESC_API_DB_USERNAME_BS}
%prod.quarkus.datasource.bs.password=${ESC_API_DB_PASSWORD_BS}

## Mandant WIN
quarkus.datasource.win.db-kind=postgresql
quarkus.datasource.win.db-version=16
quarkus.datasource.win.devservices.image-name=docker-registry.dvbern.ch/dockerhub/library/postgres:16
quarkus.datasource.win.devservices.container-env."TZ"=Europe/Zurich
# connection parameter tuning
quarkus.datasource.win.jdbc.min-size=4
quarkus.datasource.win.jdbc.max-size=50
quarkus.datasource.win.jdbc.max-lifetime=150
quarkus.datasource.win.jdbc.idle-removal-interval=60
quarkus.datasource.win.jdbc.background-validation-interval=10
quarkus.datasource.win.jdbc.leak-detection-interval=61
quarkus.datasource.win.jdbc.acquisition-timeout=8

# Our K8S-Operator provides the DB-URL via Secret
# => Login stuff only required for local development/testing
quarkus.datasource.win.devservices.db-name=esc_win
%dev.quarkus.datasource.win.devservices.reuse=true
%dev.quarkus.datasource.win.devservices.enabled=true
%dev,test.quarkus.datasource.win.username=${ESC_API_DEV_DB_USERNAME_WIN:quarkuswin}
%dev,test.quarkus.datasource.win.password=${ESC_API_DEV_DB_PASSWORD_WIN:quarkuswin}
%dev.quarkus.datasource.win.devservices.port=${ESC_API_DEV_DB_PORT_WIN:}
%test.quarkus.datasource.win.devservices.port=${ESC_API_TEST_DB_PORT_WIN:0}
%prod.quarkus.datasource.win.jdbc.url=${ESC_API_DB_URL_WIN}
%prod.quarkus.datasource.win.username=${ESC_API_DB_USERNAME_WIN}
%prod.quarkus.datasource.win.password=${ESC_API_DB_PASSWORD_WIN}

quarkus.hibernate-orm.log.jdbc-warnings=true
quarkus.hibernate-orm.log.queries-slower-than-ms=150
# persistence.xml is only used for Liquibase
quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm.schema-management.strategy=none

### LIQUIBASE
#quarkus.liquibase.migrate-at-start=false
quarkus.liquibase.bs.migrate-at-start=true
quarkus.liquibase.bs.change-log=db/changeLog_bs.xml
quarkus.liquibase.win.migrate-at-start=true
quarkus.liquibase.win.change-log=db/changeLog_win.xml
quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.liquibase.bs.contexts=test
%test.quarkus.liquibase.win.contexts=test

#### OIDC
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.enabled=true
keycloak.url=${ESC_API_OIDC_AUTH_SERVER}
%test.keycloak.url=http://dummy.keycloak
keycloak.client-id=esc-api"
quarkus.security.jaxrs.deny-unannotated-endpoints=true
quarkus.oidc.auth-server-url=${keycloak.url}/realms/bs
quarkus.oidc."bs".auth-server-url=${keycloak.url}/realms/bs
quarkus.oidc."win".auth-server-url=${keycloak.url}/realms/win

quarkus.oidc.client-id=${keycloak.client-id}
quarkus.oidc.application-type=service

quarkus.log.category."io.quarkus.oidc".level=INFO
quarkus.log.category."io.quarkus.oidc".min-level=INFO

#### OIDC on the angular side
# logout url is https://local-esc-bs.localhost:8989/realms/bs/protocol/openid-connect/logout
%test.app.deployment.client-auth-config.auth-url=http://dummy.keycloak
%test.app.deployment.client-auth-config.client-id=unit-test-client-id
%test.app.deployment.client-auth-config.realm=unit-test-realm
app.deployment.client-auth-config.auth-url=${ESC_FRONTEND_OIDC_AUTH_SERVER:${ESC_API_OIDC_AUTH_SERVER}}
app.deployment.client-auth-config.client-id=${ESC_FRONTEND_OIDC_CLIENT_ID:esc-web}
app.deployment.client-auth-config.realm=${ESC_FRONTEND_OIDC_REALM:bs}

#### JACKSON
quarkus.jackson.fail-on-unknown-properties=true

### OPENAPI
# IF use openapi.yaml from contract
# mp.openapi.scan.disable=true
# mp.openapi.extensions.servers.relative=true
# IF generate openapi.yaml from JaxRS
quarkus.smallrye-openapi.path=/openapi.yaml
quarkus.smallrye-openapi.store-schema-directory=openapi-schema/
mp.openapi.extensions.smallrye.operationIdStrategy=CLASS_METHOD
# dont generate to our source code when running tests
%test.quarkus.smallrye-openapi.enable=false
%test.quarkus.smallrye-openapi.store-schema-directory=
# END IF
openapi.ui.swaggerUiTheme=feeling-blue
openapi.ui.swaggerHeaderVisibility=hidden
openapi.ui.serverVisibility=hidden
#%dev.quarkus.smallrye-openapi.security-scheme=jwt
#%dev.quarkus.smallrye-openapi.security-scheme-name=Keycloak
# this is only for the swagger-ui
quarkus.smallrye-openapi.servers=https://local-esc-bs.localhost:8443
quarkus.smallrye-openapi.oidc-open-id-connect-url=${keycloak.url}/realms/bs/.well-known/openid-configuration

### JACOCO
%test.quarkus.jacoco.excludes=ch/dvbern/oss/hemed/esc/api/generated/**,ch/dvbern/oss/hemed/esc/api/**/Q*,ch/dvbern/oss/hemed/esc/api/**/*MapperImpl*

### LOGGING
%dev.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) (%X{TenantId}) %s%e%n
%test.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) (%X{TenantId}) %s%e%n
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %h %N[%i] %-5p [%c{3.}] (%t) (%X{Principal}) (%X{RequestSource}) (%X{RequestSourceArgs}) (%X{TenantId}) (%X{AppProject}) (%X{AppModule}) (%X{AppVersion}) (%X{AppInstance}) %s%e%n

%test.quarkus.log.category."ch.dvbern.oss.hemed.esc.api.features.schule.kontakt_person_schule.external".level=WARN
%test.quarkus.log.category."ch.dvbern.oss.hemed.esc.api.features.kinder.external".level=WARN

### Sentry
%prod.quarkus.log.sentry.enabled=true
quarkus.log.sentry.enabled=false
quarkus.log.sentry.in-app-packages=ch.dvbern.oss.hemed,ch.dvbern.dvbstarter
quarkus.log.sentry.dsn=https://df32070ea5d2f8f16c6236d02c4e08bb@sentry-relay.dvbern.ch/44
quarkus.log.sentry.environment=${app.deployment.environment}
quarkus.log.sentry.release=${app.deployment.version}
quarkus.log.sentry.context-tags=AppInstance
quarkus.log.sentry.traces-sample-rate=0.2
# Jandex / Jar-Indexing
quarkus.index-dependency.fluent-bigdecimals.group-id=com.github.honoluluhenk.fluent-bigdecimals
quarkus.index-dependency.fluent-bigdecimals.artifact-id=fluent-bigdecimals


## Proxy Settings damit wir die URL vom client kriegen
%prod.quarkus.http.proxy.proxy-address-forwarding=true
# Currently we use only the 'inoffical' x-forwarded headers
%prod.quarkus.http.proxy.allow-forwarded=false
%prod.quarkus.http.proxy.allow-x-forwarded=true
%prod.quarkus.http.proxy.enable-forwarded-host=true


## File Upload Settings
# Escada Service will need bigger allowd max form
quarkus.http.limits.max-form-attribute-size=30m
quarkus.http.body.delete-uploaded-files-on-end=true

### S3 Service
quarkus.s3.devservices.enabled=true
esc.s3.bucket-name=esc
%test.esc.bucket.name=esc-test-bucket
quarkus.s3.devservices.buckets=${esc.s3.bucket-name}
esc.bucket.allowed-mimetypes=image/tiff,image/jpeg,image/png,application/pdf
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=eu-central-2
%test.quarkus.s3.aws.region=eu-central-2
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${ESC_S3_ACCESS_KEY}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${ESC_S3_ACCESS_SECRET}
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test-key
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test-secret

### Features
app.allow-db-reset=false
app.allow-timetravel=false
%test.app.allow-timetravel=true
app.version-filter-enabled=false

### Scheduler
%test.quarkus.scheduler.enabled=false

quarkus.quartz.clustered=true
quarkus.quartz.store-type=jdbc-cmt
# Quartz Scheduler fix in Basler-DB (damit wir kein default brauchen)
quarkus.quartz.datasource=bs
app.scheduler.benutzer.inaktivieren.cronexpression=0 0 3 * * ?
app.scheduler.kinder.inaktivieren.cronexpression=0 30 3 * * ?
app.scheduler.document-queue.cronexpression=30 * * * * ?
app.scheduler.document-queue.clean-up.cronexpression=0 0 4 * * ?
app.scheduler.reload.duplikate.cronexpression=0 0 5 * * ?

### Mail
esc.mail.overriding.recipients.enabled=${ESC_MAIL_OVERRIDING_RECIPIENTS_ENABLED:false}
esc.mail.overriding.recipients.address=${ESC_MAIL_OVERRIDING_RECIPIENTS_ADDRESS:''}
%test.esc.mail.overriding.recipients.enabled=FALSE
