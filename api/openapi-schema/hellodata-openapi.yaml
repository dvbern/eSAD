      operationId: HelloDataResource_exportUntersuchungen
      tags:
      - HelloData
      responses:
        "200":
          description: |-
            NDJSON (newline delimited JSON): one JSON object per line, separated by \n, with no enclosing array and no commas. The schema describes a single line.

            Every data line matches HelloDataUntersuchungenJson. The final line is a HelloDataSentinelJson: if it is missing, the response was truncated and the load must be treated as failed - after HTTP 200 no error can be signalled by status code.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                - $ref: "#/components/schemas/HelloDataUntersuchungenJson"
                - $ref: "#/components/schemas/HelloDataSentinelJson"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Export Untersuchungen
      security:
      - SecurityScheme:
        - HELLODATA_EXPORT_LESEN
