openapi: 3.1.0
info:
  title: esc-api API
paths:
  /api/hellodata/v1/json/anlaesse:
    get:
      operationId: HelloDataResource_exportAnlaesseAsJson
      tags:
      - HelloData
      responses:
        "200":
          description: |-
            A single JSON document: the rows in a `data` array, closed by a `_meta` object. Same rows and same guarantees as the NDJSON variant, only framed differently.

            The response is streamed, so `_meta` is the last member of the document - `rowCount` is not known before the last row has been read. JSON members are unordered, so read it by key, not by position. If `_meta` is missing the response was truncated and the load must be treated as failed - after HTTP 200 no error can be signalled by status code. (A truncated response here is not valid JSON either, so a strict parser catches it too.)

            Note that consuming this with a whole-document parser buffers the entire export on the client. Prefer the NDJSON variant if your tooling can read it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloDataAnlaesseEnvelopeJson"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Export Anlaesse As Json
      security:
      - SecurityScheme:
        - HELLODATA_EXPORT_LESEN
