paths:
  /api/aerzte:
    get:
      operationId: ArztResource_findAllArzte
      tags:
      - Aerzte
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArztListJson"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Find All Arzte
      security:
      - SecurityScheme:
        - AERZTE_LESEN
    post:
      operationId: ArztResource_createArzt
      tags:
      - Aerzte
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArztSaveJson"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArztJson"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      summary: Create Arzt
      security:
      - SecurityScheme:
        - AERZTE_SCHREIBEN
  /api/aerzte/export/{mode}:
    post:
      operationId: ArztResource_exportAerzte
      tags:
      - Aerzte
      parameters:
      - name: mode
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ExportMode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArztIdListJson"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      summary: Export Aerzte
      security:
      - SecurityScheme:
        - AERZTE_LESEN
  /api/aerzte/{arztId}:
    put:
      operationId: ArztResource_updateArzt
      tags:
      - Aerzte
      parameters:
      - name: arztId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/IDArzt"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArztSaveJson"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArztJson"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      summary: Update Arzt
      security:
      - SecurityScheme:
        - AERZTE_SCHREIBEN
    delete:
      operationId: ArztResource_removeArzt
      tags:
      - Aerzte
      parameters:
      - name: arztId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/IDArzt"
      responses:
        "204":
          description: No Content
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Remove Arzt
      security:
      - SecurityScheme:
        - AERZTE_LESEN
    get:
      operationId: ArztResource_getArzt
      tags:
      - Aerzte
      parameters:
      - name: arztId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/IDArzt"
      responses:
