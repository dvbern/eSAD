# general settings
skip_provider_button = true
reverse_proxy = true
tls_cert_file = "/var/run/secrets/serving-cert/local-esc-bs.localhost.pem"
tls_key_file = "/var/run/secrets/serving-cert/local-esc-bs.localhost.key"

# allow all email domains
email_domains = [ "*" ]
insecure_oidc_allow_unverified_email = true

# skips
skip_auth_routes = [
  "GET=^/fonts",
  "GET=^/img",
  "GET=^/icons",
  "GET=^/assets",
  "GET=^/[^/]*\\.(js|css)$",
]

# cookie settings (seemed to require port at one point)
cookie_domains = [ "local-esc-bs.localhost" ]
cookie_samesite = "lax"
cookie_refresh="240s"
cookie_expire="30m"

# upstream settings
pass_authorization_header = true
upstreams = [
  "https://local-esc-bs.localhost:4200/"
]
ssl_upstream_insecure_skip_verify=true
upstream_timeout="300s"

# oidc provider
provider =  "oidc"
oidc_issuer_url = "http://esc-keycloak:8080/realms/bs"
insecure_oidc_skip_issuer_verification = true  # due to back-channel connection to keycloak the issuer does not match
code_challenge_method = "S256"


redirect_url = "https://local-esc-bs.localhost:4443/oauth2/callback"
client_id = "esc-oauth2-proxy-local"

# whitelist for logout url
whitelist_domains = [ "*.localhost:4443", "*.dvbern.ch", "*.localhost:8989"]



