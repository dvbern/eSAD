  /api/v1/administrations/benutzerId/{benutzerId}:
    get:
      tags:
        - administrations
      summary: Make KC User from Benutzer
      operationId: convertToKC
      parameters:
        - name: benutzerId
          in: path
          required: true
          schema:
            format: int32
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/administrations/convertAllToKCTestMode:
    get:
      tags:
        - administrations
      summary: 'Make all KC User from Benutzer, just while testmode'
      operationId: convertAllToKCTestMode
      responses:
        '200':
          description: OK
  /api/v1/administrations/importAllToKC:
