      operationId: requestPasswordResetLink
      parameters:
        - name: benutzerId
          in: path
          required: true
          schema:
            format: int32
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/getMitgliedMitHistoryInfo:
    get:
      tags:
        - mitglied
      summary:
        "Gibt das Mitglied mit der übergebenen Id zurück. Zudem wird geprü\
        ft, ob die Abrechnungsnummer des Mitglieds mutiert wurde und somit nicht mehr\
        \ aktuell ist. Das zurückgegebene Objekt enthält immer auch die aktuelle Abrechnungnummer.\
        \ Wenn die Abrechnungsnummer nicht mutiert wurde, ist die aktuelle Abrechnungsnummer\
        \ identisch mit der Abrechnungsnummer des Mitglieds."
      operationId: getMitgliedMitHistoryInfo
      parameters:
        - name: mitgliedId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MitgliedMitHistoryInfo'
  /api/v1/mitgliedLightResultDto:
    get:
      tags:
        - unauthenticated
      summary:
        "Sucht das Mitglied mit der übergebenen Abrechnungsnummer. Die Suche\
        \ erfolgt immer direkt in Nil, egal ob das Mitglied in ePortal bereits vorhanden\
        \ ist oder nicht. Das Mitglied wird im ePortal neu erstellt, wenn es noch\
        \ nicht vorhanden ist. Ansonsten wird es aktualisiert. Die Methode gibt einen\
        \ leichten Wrapper zurück, der die Existenz des Mitglieds bestätigt oder nicht\
        \ und, wenn das Mitglied existiert noch seine Art."
      operationId: searchMitgliedLightResultDto
      parameters:
        - name: abrechnungsnummer
          in: query
          schema:
            type: string
      responses:
        default:
          description: searchMitgliedLightResultDto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMitgliedResultDto'
