      operationId: createBenutzerWithCaptchaCheck
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenutzerWithCaptchaCheckDto'
      responses:
        default:
          description: Erstellt einen neuen Benutzer mit Captcha-Prüfung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benutzer'
