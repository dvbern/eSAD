<div class="svui_sort">
  <svui-icon [useCase]="'sortieren'" class="svui_sort__icon svui_sort__icon--asc" [class.svui_sort__icon--hidden]="sortDirection() === 'DESC'" />

  <svui-icon [useCase]="'sortieren'" class="svui_sort__icon svui_sort__icon--desc" [class.svui_sort__icon--hidden]="sortDirection() === 'ASC'" />
</div>
