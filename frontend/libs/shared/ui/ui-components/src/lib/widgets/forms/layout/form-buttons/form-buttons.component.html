<!-- BUTTONS -->
@if (canEdit()) {
  @if (isEditMode()) {
    <button svuiButton="primary"
            type="submit"
            [working]="saving()"
          data-testid="button-save">{{ 'global.save' | transloco }}
    </button>
  }
  @if (isEditMode()) {
    <button svuiButton="secondary" type="button" (click)="cancel()">{{ 'global.cancel' | transloco }}</button>
  }
  @if (isViewMode()) {
    <a svuiLikeAButton="primary" type="button" [routerLink]="this.routeToEdit()">{{ 'global.edit' | transloco }}</a>
  }
}
