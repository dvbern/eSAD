@if (controlType === 'checkbox' || controlType === 'radios') {
  <div class="svui_standalone-control svui_standalone-control--check form-check">
    <ng-content select="[svuiCheckbox],[svuiSingleValueCheckbox],[svuiRadio]"/>

    <label [for]="id" class="svui_standalone-control__label form-check-label stretched-link">
      {{ label() }}
    </label>
  </div>

} @else {
  <div class="svui_standalone-control">
    <svui-form-control-top-label [required]="required " [controlId]="id">
      {{ label() }}
    </svui-form-control-top-label>

    <ng-content/>
  </div>
}
