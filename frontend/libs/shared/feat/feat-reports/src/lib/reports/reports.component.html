<feat-page [heading]="'reports.page.title' | transloco">
  <svui-page-header-buttons>
    <button svuiIconOnlyButton="primary"
            type="button"
            [tooltip]="'reports.action.manual.deletion' | transloco"
            [icon]="'loeschen'"
            (click)="deleteGeneratedDocsManually()"
    >
    </button>
  </svui-page-header-buttons>

  <feat-document-queue/>

  @if (canViewSpssReports()) {
    <feat-spss-form/>
  }
  @if (canViewIndividuelleReports()) {
    <feat-individuelle-reports-form />
  }

</feat-page>
