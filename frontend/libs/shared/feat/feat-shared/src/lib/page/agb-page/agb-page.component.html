<feat-page [heading]="'onboarding.title' | transloco">

  <!-- Info Text-->
  <p>{{ 'onboarding.text.info' | transloco }}</p>
  <p [innerHTML]="'onboarding.text.info.agb' | transloco"></p>
  <br>

  <!-- Checkbox & Link AGB-->
  <div style="display: flex; align-items: center; gap: 8px;">
    <input
      svuiCheckbox
      type="checkbox"
      [checked]="accepted()"
      (click)="toggleAccepted()">
    <span [innerHTML]="'onboarding.text.accept.agb' | transloco"></span>
  </div>
  <button
    style="margin-top: 15px;"
    svuiButton="primary"
    type="button"
    (click)="acceptAGB()"
    [disabled]="!accepted()">
    {{ 'global.tooltip.icon.next' | transloco }}
  </button>

</feat-page>
