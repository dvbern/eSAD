@if (isTimetravelEnabled() && (hasTimetravelRights() || isTimetravelling())) {
  <div class="d-flex flex-column align-items-end">
    <span class="d-flex align-items-center">
      <svui-icon useCase="timetravel" class="me-1"/>
      <span class="text-nowrap">Time Travel</span>
    </span>
    <span
      class="badge bg-primary text-white d-flex align-items-center"
      [class.bg-danger]="isTimetravelling()">
    <span>{{ now() | date }}</span>
  </span>
  </div>
}
