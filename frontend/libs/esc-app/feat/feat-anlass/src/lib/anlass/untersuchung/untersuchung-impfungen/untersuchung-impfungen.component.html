<!-- Header -->
<svui-card-in-card class="mb-3">
  <feat-untersuchung-impfungen-header
    [einladung]="einladung()"
    [impfausweisUnvollstaendig]="!!untersuchungImpfungenStore.impfausweis()?.impfausweisUnvollstaendig"
    [impfausweisNichtVorhanden]="!!untersuchungImpfungenStore.impfausweis()?.impfausweisNichtVorhanden"
    [impfausweisZweiPlusEinsSchema]="!!untersuchungImpfungenStore.impfausweis()?.impfausweisZweiPlusEinsSchema"
    (impfausweisUnvollstaendigChanged)="impfausweisUnvollstaendigChanged($event)"
    (impfausweisNichtVorhandenChanged)="impfausweisNichtVorhandenChanged($event)"
    (impfausweisZweiPlusEinsSchemaChanged)="impfausweisZweiPlusEinsSchemaChanged($event)"
    (gotoImpfausweisClicked)="gotoImpfausweis()"
  >
  </feat-untersuchung-impfungen-header>
</svui-card-in-card>

<!-- Aktueller Impfstatus -->
@if (anlassStore.selectedEntity()?.anlassConfig?.impfungenUebersicht !== RequirementSetting.NOT_VISIBLE) {
  <svui-card-in-card class="mb-3">
    <feat-untersuchung-impfstatus
      #impfstatus
      [impfstatusList]="untersuchungImpfungenStore.impfstatusList()"
      [anlassConfig]="anlassStore.selectedEntity()?.anlassConfig"
      [impfausweis]="untersuchungImpfungenStore.impfausweis()"
      [loading]="untersuchungImpfungenStore.loader.isLoading()"
      (saveImpfstatusList)="onSaveImpfstatusList($event)"
    />
  </svui-card-in-card>
}

<!-- Geplante Impfungen -->
@if (anlassStore.selectedEntity()?.anlassConfig?.impfungenListe !== RequirementSetting.NOT_VISIBLE) {
  <svui-card-in-card class="mb-3">
    <feat-untersuchung-impfungen-intern-list/>
  </svui-card-in-card>
}

<svui-layout-two-columns>

  <!-- Checkliste -->
  @if (anlassStore.selectedEntity()?.anlassConfig?.showChecklist) {
    <svui-card-in-card left>
      <feat-untersuchung-impfungen-checklist/>
    </svui-card-in-card>
  }

  <!-- Doppelkontrolle Impfentscheid -->
  <svui-card-in-card left>
    <feat-untersuchung-doppelkontrolle-impfentscheid #doppelkontrolle/>
  </svui-card-in-card>

  <!-- Massnahmen -->
  <svui-card-in-card right>
    <feat-untersuchung-impfungen-massnahmen />
  </svui-card-in-card>

</svui-layout-two-columns>
