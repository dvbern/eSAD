@if (anlassStore.selectedEntity()?.anlassConfig?.showTabSehenBemerkungenFragenbogen) {

  <form svuiFormLayout
        [formType]="'kacheln'"
        [mode]="'edit'"
        [formGroup]="form.group"
        (ngSubmit)="submitIfValid()">

    <!-- Bemerkung -->
    @if (anlassStore.selectedEntity()?.anlassConfig?.sehenBemerkungenFragebogen !== RequirementSetting.NOT_VISIBLE) {
      <svui-title [context]="'formSection'"
                  class="mb-3">{{ 'untersuchung.tab.sehen.bemerkungfragebogen' | transloco }}
      </svui-title>
      <svui-form-control
        [label]="'untersuchung.tab.sehen.bemerkungfragebogen' | transloco"
        [topLabelVisibility]="'hidden'"
        [viewValue]="form.group.controls.bemerkungenFragebogen.value">
        <textarea svuiTextarea [formControl]="form.group.controls.bemerkungenFragebogen" [minHeightPx]="150"></textarea>
      </svui-form-control>
    }

    <!-- Save / Cancel Buttons -->
    @if (canEdit()) {
      <svui-save-cancel-buttons
        [saving]="false"
        [canEdit]="true"
        (cancelClicked)="abbrechen()"/>
    }
  </form>
}
