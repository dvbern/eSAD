<feat-page [heading]="pageTitle()"
           [backLink]="{label: 'global.back' | transloco, routerLink: Path.RELATIVE_ONE_UP + '/' + Path.ANLASS_PLANUNG}">

  <!-- Kinder-Tabs -->
  <ul ngbNav class="nav-tabs" [activeId]="untersuchungStore.currentTabId()" (navChange)="preventNav($event)">
    @for (tabInfo of untersuchungStore.tabList(); track tabInfo.einladungID) {
      <li [ngbNavItem]="tabInfo.einladungID">

        <a ngbNavLink
           [routerLink]="Path.ANLASS_UNTERSUCHUNG_EINLADUNG + '/' + tabInfo.einladungID"
           [routerLinkActive]="isEinladungActive(tabInfo.einladungID) ? 'active': ''"
           [queryParamsHandling]="'preserve'"
           aria-current="page">
          <span>{{ tabInfo.label }}</span>

          <button class="btn-close ms-3 fw-light" (click)="closeTab(tabInfo.einladungID, $event)">&nbsp;</button>
        </a>
      </li>
    }

    <!-- Abstand -->
    <li style="flex-grow: 1;"></li>

    <!-- Add Button -->
    <svui-collapsible-menu
      [loading]="false"
      [label]="'ui.kinder.tabs.add' | transloco"
      [menuStyle]="'LINK'">
      @for (tab of untersuchungStore.hiddenTabs(); track tab.einladungID) {
        <button
          ngbDropdownItem
          (click)="addTab(tab.einladungID)">
          {{ tab.label }}
        </button>
      }
      @if (untersuchungStore.hiddenTabs().length === 0) {
        <button
          ngbDropdownItem>
          {{ 'ui.kinder.tabs.add.allAdded' | transloco }}
        </button>
      }
    </svui-collapsible-menu>

  </ul>

  <svui-card>
    <feat-untersuchung-tabs
      [showLinkToDossier]="true"
      [canViewUntersuchungKindDaten]="canViewUntersuchungKindDaten()"
      (untersuchungAbschliessen)="untersuchungAbschliessen()"
    ></feat-untersuchung-tabs>
  </svui-card>

</feat-page>
