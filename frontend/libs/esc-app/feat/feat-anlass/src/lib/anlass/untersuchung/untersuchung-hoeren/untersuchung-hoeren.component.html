@if (anlassConfig()?.showTabHoeren) {
  <div>
    @if (canEdit()) {
      <svui-card-in-card class="mb-3">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>{{'untersuchung.tab.defaultwerte.info' | transloco}}</span>
          <button
            class="nav-link"
            (click)="loadDefaults()"
            data-testid="untersuchung-hoeren-defaultwerte">
            <svui-icon [useCase]="'edit'"></svui-icon>
            {{ 'untersuchung.tab.defaultwerte' | transloco }}
          </button>
        </div>
      </svui-card-in-card>
    }

    @if (anlassConfig()?.showTabHoerenAudiogramm) {
      <svui-card-in-card class="mb-3">
        <feat-untersuchung-hoeren-audiogramm/>
      </svui-card-in-card>
    }
    @if (anlassConfig()?.showTabHoerenOtoskopie) {
      <svui-card-in-card class="mb-3">
        <feat-untersuchung-hoeren-otoskopie/>
      </svui-card-in-card>
    }
  </div>
}
