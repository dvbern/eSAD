@if (anlassStore.selectedEntity()?.anlassConfig?.showTabUntersuchung) {

  @if (this.anlassStore.canUserEditAnlassInCurrentState() && !!this.store.defaultArztInitial()) {
    <svui-card-in-card class="mb-3">
      <div style="display: flex; justify-content: end;">
        <button
          class="nav-link"
          (click)="loadDefault()">
          <svui-icon [useCase]="'edit'"></svui-icon>
          {{ 'untersuchung.tab.sehen.defaultwerte' | transloco }}
        </button>
      </div>
    </svui-card-in-card>
  }

  @if (anlassConfig()?.showTabUntersuchungBeurteilung) {
    <svui-card-in-card class="mb-3">
      <feat-untersuchung-arzt-beurteilung/>
    </svui-card-in-card>
  }

  @if (anlassConfig()?.showTabUntersuchungBemerkung) {
    <svui-card-in-card class="mb-3">
      <feat-untersuchung-arzt-bemerkung/>
    </svui-card-in-card>
  }
}
