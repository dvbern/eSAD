<feat-page [heading]="pageTitle()"
           [backLink]="{label: 'global.back' | transloco, routerLink: Path.RELATIVE_TWO_UP}">

  <svui-page-header-buttons>
    <!-- Status -->
    <ng-select
      [clearable]="false"
      appendTo="body"
      svuiNgSelect
      bindLabel='dummy'
      [disabled]="!store.canUserEditAnlassInCurrentState()"
      [ngModel]="anlassStatus()"
      [placeholder]="'global.select.bitte-auswaehlen' | transloco"
      (change)="onStatusChange($event)"
      data-testid="anlass-status-select"
    >
      @for (status of anlassStatusList; track status) {
        <ng-option [value]="status">
          {{ 'AnlassStatus.' + status | transloco }}
        </ng-option>
      }
    </ng-select>

    <!--    Options-Button: Ausdruck-Varianten -->
    @if (canDownloadExport()) {
<!--      to make sure tenant BS that does not have the new print we add an else that renders the old btn-->
      @if (canDownloadPrintImpfen()) {
        <svui-collapsible-menu
          [buttonColor]="'secondary'"
          [loading]="false"
          label="{{ 'global.actionmenu.tooltip' | transloco }}">
          <button ngbDropdownItem
                  type="button"
                  data-testid="button-anlass-drucken"
                  (click)="downloadPrint()">{{ 'anlass.list.drucken' | transloco }}
          </button>
          <button ngbDropdownItem
                  type="button"
                  data-testid="button-anlass-drucken-impfen"
                  (click)="downloadPrintImpfen()">{{ 'anlass.list.drucken.impfen' | transloco }}
          </button>
        </svui-collapsible-menu>
      } @else {
        <button svuiButton="secondary"
                type="button"
                data-testid="button-anlass-drucken"
                [icon]="'herunterladen'"
                (click)="downloadPrint()">{{ 'anlass.list.drucken' | transloco }}
        </button>
      }
    }

    <!-- Bearbeitung -->
    <button [disabled]="!store.canUserEditAnlassInCurrentState()"
            data-testid="button-anlass-bearbeiten"
            svuiButton="primary"
            type="button"
            [icon]="'previous'"
            (click)="gotoBearbeitung()">{{ 'anlass.list.link.bearbetung' | transloco }}
    </button>
  </svui-page-header-buttons>


  <feat-anlass-planung-anlassdaten-daten/>


  <feat-anlass-planung-einladungen-liste/>

  @if (anzahlAusgewaehlteKinder() > 0) {
    <button svuiButton="primary" type="button" (click)="gotoUntersuchung()" class="mt-3"
            data-testid="button-kinder-auswaehlen">
      {{ 'anlass.kinder.untersuchung.anzahl' | transloco: {anzahl: anzahlAusgewaehlteKinder()} }}
    </button>
  }

</feat-page>
