<feat-page [heading]="'notizen.detail.edit.titel' | transloco: { nameKind: kind()?.vorname + ' ' + kind()?.name }"
           [backLink]="{label: 'global.back' | transloco, routerLink: Path.RELATIVE_ONE_UP}">
  <feat-notizen
    [kindId]="kind()?.id"
    [existingNotiz]="notizDetailStore.notiz()"
    [notizenFiles]="notizDetailStore.notizenFiles()"
    [loader]="notizDetailStore.saveLoader"
    (saveNotiz)="onSaveNotiz($event)"
    (saveNotizSilent)="onSaveNotizSilent($event)"
    (removeNotizFile)="onRemoveNotizFile($event)"
    (mobileUpload)="onMobileUpload($event)"
  />
</feat-page>
