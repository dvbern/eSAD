<feat-page [heading]="pageTitle() | transloco"
           [backLink]="{label: 'global.back' | transloco, routerLink: '/' + Path.ADMIN + '/' + Path.SCHULEN}">
  <svui-card>
    <ul ngbNav style="margin-bottom: 2rem;">

      <li ngbNavItem>
        <a class="nav-link"
           [routerLink]="Path.STAMMDATEN"
           [routerLinkActive]="'active'"
           aria-current="page">{{ 'schule.detail.tab.stammdaten' | transloco }}</a>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.KONTAKTPERSONEN"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'schule.detail.tab.kontaktpersonen' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.KLASSEN"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'schule.detail.tab.klassen' | transloco }}
        </button>
      </li>
    </ul>
    <router-outlet></router-outlet>
  </svui-card>
</feat-page>
