<feat-page [heading]="pageTitle() | transloco: { nameKind: dossierStore.nameKind() }"
           [backLink]="{label: 'global.back' | transloco, routerLink: Path.RELATIVE_TWO_UP}">
  <feat-notizen
    [kindId]="kindId()"
    [initialNotiz]="defaultNotizSig()"
    [existingNotiz]="kinderNotizStore.selectedEntity()"
    [notizenFiles]="kinderNotizStore.notizenFiles() ?? []"
    [loader]="kinderNotizStore.saveLoader"
    (saveNotiz)="onSaveNotiz($event)"
    (saveNotizSilent)="onSaveNotizSilent($event)"
    (removeNotizFile)="onRemoveNotizFile($event)"
    (mobileUpload)="onMobileUpload($event)"
  />
</feat-page>
