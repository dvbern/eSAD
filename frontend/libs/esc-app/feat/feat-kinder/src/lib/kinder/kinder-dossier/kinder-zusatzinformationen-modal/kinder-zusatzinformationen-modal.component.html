<feat-dialogs-modal [modalTitle]="'kind.dossier.zusatzinformationen.modal.titel' | transloco">
  <form [formGroup]="form.group"
        (ngSubmit)="speichern()">

    <!--Kinderschutzfall-->
    <svui-standalone-control [label]="'kind.dossier.zusatzinformationen.modal.kinderschutzfall' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.kinderschutzfall">
    </svui-standalone-control>

    <!--Keine Auskunft an Drittpersonen-->
    <svui-standalone-control [label]="'kind.dossier.zusatzinformationen.modal.keineAuskunft' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.keineAuskunftAnDrittpersonen">
    </svui-standalone-control>

    <!--sansPapier-->
    <svui-standalone-control [label]="'kind.dossier.zusatzinformationen.modal.sansPapier' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.sansPapier">
    </svui-standalone-control>

    <!--Anderes/Freitext-->
    <svui-standalone-control [label]="'kind.dossier.zusatzinformationen.modal.andere' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.andereZusatzinformation">
    </svui-standalone-control>

    <!--Textfeld-->
    @if (form.group.controls.andereZusatzinformation.value) {
      <div class="zusatzinformationen-bemerkung-container">
        <label [for]="'andereZusatzinformationBemerkung'">{{ 'kind.dossier.zusatzinformationen.modal.bemerkung' | transloco }}</label>
        <textarea [id]="'andereZusatzinformationBemerkung'"
                  [formControl]="form.group.controls.andereZusatzInformationText"
                  svuiTextarea
        ></textarea>
      </div>
    }

    <!-- BUTTONS -->
    <svui-save-cancel-buttons
      class="mt-3"
      [saving]="false"
      [canEdit]="true"
      (cancelClicked)="abbrechen()"
    />
  </form>
</feat-dialogs-modal>
