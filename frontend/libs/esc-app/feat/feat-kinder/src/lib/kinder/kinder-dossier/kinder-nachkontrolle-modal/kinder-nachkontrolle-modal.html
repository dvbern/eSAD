<feat-dialogs-modal [modalTitle]="'kind.dossier.nachkontrolle.modal.titel' | transloco">

  <form [formGroup]="form.group"
        (ngSubmit)="speichern()">

    <svui-standalone-control [label]="'kind.dossier.nachkontrolle.modal.sehen' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.nachkontrolleSehen">
    </svui-standalone-control>

    <svui-standalone-control [label]="'kind.dossier.nachkontrolle.modal.hoeren' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.nachkontrolleHoeren">
    </svui-standalone-control>

    <svui-standalone-control [label]="'kind.dossier.nachkontrolle.modal.greoesseGewicht' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.nachkontrolleGroesseGewicht">
    </svui-standalone-control>

    <svui-standalone-control [label]="'kind.dossier.nachkontrolle.modal.sprache' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.nachkontrolleSprache">
    </svui-standalone-control>

    <svui-standalone-control [label]="'kind.dossier.nachkontrolle.modal.motorik' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.nachkontrolleMotorik">
    </svui-standalone-control>

    <svui-standalone-control [label]="'kind.dossier.nachkontrolle.modal.anderes' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.nachkontrolleAnderes">
    </svui-standalone-control>

    <!-- BUTTONS -->
    <svui-save-cancel-buttons
      class="mt-3"
      [saving]="false"
      [canEdit]="true"
      (cancelClicked)="abbrechen()"
    />

  </form>
</feat-dialogs-modal>
