<feat-dialogs-modal [modalTitle]="'kind.dossier.immunisierung.modal.titel' | transloco">
  <form [formGroup]="form.group"
        (ngSubmit)="speichern()">

    <svui-standalone-control [label]="'kind.dossier.immunisierung.modal.masern' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.immunitaetMasern">
    </svui-standalone-control>

    <svui-standalone-control [label]="'kind.dossier.immunisierung.varizellen.masern' | transloco">
      <input type="checkbox" svuiCheckbox [formControl]="form.group.controls.immunitaetVarizellen">
    </svui-standalone-control>

    <!-- BUTTONS -->
    <svui-save-cancel-buttons
      class="mt-3"
      [saving]="false"
      [canEdit]="true"
      (cancelClicked)="abbrechen()"
    />
  </form>
</feat-dialogs-modal>
