<feat-dialogs-modal [modalTitle]="'kind.dossier.id.setzen.modal.titel' | transloco">
  <form [formGroup]="form.group"
        svuiFormLayout
        [mode]="DetailMode.EDIT"
        (ngSubmit)="speichern()">

    <div style="grid-column: span 6;">
      {{ 'kind.dossier.id.setzen.modal.consequence' | transloco }}
    </div>

    <svui-form-control [label]="'kind.dossier.id.setzen.modal.esadID' | transloco"
                       [viewValue]="form.group.controls.esadId.value"
                       size="full">
      <input svuiTextInput [formControl]="form.controlAt('esadId')"/>
    </svui-form-control>

    <!-- BUTTONS -->
    <svui-save-cancel-buttons
      class="mt-3"
      [saving]="false"
      [canEdit]="true"
      (cancelClicked)="abbrechen()"
    />
  </form>
</feat-dialogs-modal>
