<feat-page [heading]="pageTitle()"
           [backLink]="{label: 'global.back' | transloco, routerLink: '/' + Path.CONFIG + '/' + Path.ANLASS_CONFIG}">

  @if (anlassConfigHelperService.neverEditable()) {
    <div class="pb-3">
      <svui-status-text [icon]="'warning'"
                        class="pt-3"
                        statusColor="warning">{{ 'anlassconfig.info.never.editable'|transloco }}
      </svui-status-text>
    </div>
  }
  @if (anlassConfigHelperService.canEdit()) {
    <div class="pb-3">
      <svui-status-text [icon]="'warning'"
                        class=""
                        statusColor="warning">{{ 'anlassconfig.info.editable'|transloco }}
      </svui-status-text>
    </div>
  }

  <svui-card>
    <ul ngbNav style="margin-bottom: 2rem;">
      <li ngbNavItem>
        <a class="nav-link"
           [routerLink]="Path.ANLASS_CONFIG_BASIS"
           [routerLinkActive]="'active'"
           aria-current="page">{{ 'anlassconfig.detail.tab.basis' | transloco }}</a>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.ANLASS_CONFIG_DATEN"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.daten' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.ANLASS_CONFIG_VORABKLAERUNGEN"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.vorabklaerungen' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.ANLASS_CONFIG_IMPFUNGEN"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.impfungen' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.ANLASS_CONFIG_SEHEN"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.sehen' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.ANLASS_CONFIG_HOEREN_AUDIOGRAMM"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.hoerenaudiogramm' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.ANLASS_CONFIG_HOEREN_OTOSKOPIE"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.hoerenotoskopie' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"
                [routerLink]="Path.ANLASS_CONFIG_GROEOSSE_GEWICHT"
                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.groessegewicht' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"

      <li ngbNavItem>

        </button>
      </li>
      <li ngbNavItem>

                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.schulrelevante.beeintraechtigung' | transloco }}
        </button>
      </li>
      <li ngbNavItem>
        <button class="nav-link"
                [disabled]="store.selectedIsNew()"

                [routerLinkActive]="'active'"
                aria-current="page">{{ 'anlassconfig.detail.tab.bewegungsapparat' | transloco }}
        </button>

    <router-outlet></router-outlet>
  </svui-card>
