<form svuiFormLayout
      [formGroup]="form.group"
      (ngSubmit)="submitIfValid()"
      [mode]="store.detailMode()">
  <h2 svuiHeading="formSection">{{ 'anlassconfig.detail.tab.vorabklaerungen' | transloco }}</h2>

  <!-- vorabklaerungenFragebogenStatus -->
  <feat-anlass-config-requirement-setting
    [labelKey]="'anlassconfig.label.vorabklaerungenFragebogenStatus'"
    [formControlAttr]="form.group.controls.vorabklaerungenFragebogenStatus"></feat-anlass-config-requirement-setting>

  <!-- vorabklaerungenEinverstaendnisImpfungen -->
  <feat-anlass-config-requirement-setting
    [labelKey]="'anlassconfig.label.vorabklaerungenEinverstaendnisImpfungen'"
    [formControlAttr]="form.group.controls.vorabklaerungenEinverstaendnisImpfungen"></feat-anlass-config-requirement-setting>

  <!-- vorabklaerungenChronischeKrankheiten -->
  <feat-anlass-config-requirement-setting
    [labelKey]="'anlassconfig.label.vorabklaerungenChronischeKrankheiten'"
    [formControlAttr]="form.group.controls.vorabklaerungenChronischeKrankheiten"></feat-anlass-config-requirement-setting>

  <!--messages for whole form -->
  <svui-form-error-message [errors]="form.group.touched ? form.group.errors : null"/>

  <!-- BUTTONS -->
  <svui-form-buttons
    [mode]="store.detailMode()"
    [isCreate]="store.selectedIsNew()"
    [saving]="store.saveLoader.isLoading()"
    [canEdit]="anlassConfigHelperService.canEdit()"
    routeToEdit="../edit"
    [routeOnCancelUpdate]="[Path.RELATIVE_ONE_UP, 'view']"
    [routeOnCancelCreate]="[Path.RELATIVE_TWO_UP]"
  />
</form>
